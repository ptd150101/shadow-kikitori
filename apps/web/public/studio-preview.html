const defaults=()=>({projects:[{id:'sample',name:'Hẹn nhau trước kỳ thi',ja:'試験の前に',level:'N4',type:'audio',duration:66,chunks:seed(),last:2,revision:1},{id:'sample2',name:'Hội thoại tại thư viện',ja:'図書館で勉強しましょう',level:'N4',type:'audio',duration:28,chunks:seed().slice(6).map((c,i)=>({...c,id:'l'+i,start:i*8,end:(i+1)*8})),last:0,revision:1}],drafts:{},results:{},notes:{},difficult:['sample:s2','sample:s4'],settings:{speed:1,loop:false,furigana:true,subjp:true,subvi:true,gap:1,auto:false},last:'sample'});const KEY='jlpt-studio-violet-v1';let data;try{data=JSON.parse(localStorage.getItem(KEY)||'null')}catch{};let S=data?.projects?.length&&data.settings?data:defaults();let page='library',tab='listen',mode='full',pid=S.last||'sample',ix=0,job=null,jobTimer=null,fileMap={},fileUrl={},source='sample',preset='balanced',importFile=null,importName='',youtube='',filter='all',sort='recent',search='',reviewFilter='all',settingTab='learning',layout='focus',modalType='',modalInfo={},previousFocus=null,toastTimer,player=null,playing=false,progress=0,tick=null,graded=false,hinted=false,undo=[],redo=[];const P=()=>S.projects.find(x=>x.id===pid)||S.projects[0],C=()=>P().chunks[Math.min(ix,P().chunks.length-1)],K=(c=C(),m=mode)=>`${pid}:${c.id}:${m}`,marked=c=>S.difficult.includes(`${pid}:${c.id}`),R=(c=C(),m=mode)=>S.results[K(c,m)],done=p=>p.chunks.filter(c=>['full','cloze','translation'].some(m=>{let r=S.results[`${p.id}:${c.id}:${m}`];return r&&!r.revealed&&!r.stale})).length,pct=p=>Math.round(done(p)/p.chunks.length*100);
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch{notify('Không lưu được dữ liệu lâu dài trong trình duyệt này.')}}function notify(x){clearTimeout(toastTimer);$('#toast').innerHTML=`${icon('Info')}${esc(x)}`;$('#toast').className='toast';toastTimer=setTimeout(()=>{$('#toast').className=''},3500)}function stop(){if(player)player.pause();if('speechSynthesis'in window)window.speechSynthesis.cancel();clearInterval(tick);playing=false;progress=0;drawControls()}function go(p){stop();page=p;render();scrollTo(0,0)}function open(id,t='listen',i=null){stop();pid=id;tab=t;mode=t==='translation'?'translation':'full';ix=i??(P().last||0);P().last=ix;S.last=id;save();page='workspace';render();scrollTo(0,0)}function select(i){stop();ix=Math.max(0,Math.min(P().chunks.length-1,i));P().last=ix;save();render()}function nav(k,l,n,count){return `<button class="nav ${page===k?'active':''}" data-nav="${k}">${icon(n)}${l}${count?`<span class="count">${count}</span>`:''}</button>`}
function frame(body){let p=P();return `<div class="app"><aside class="sidebar"><div class="brand"><span class="mark" lang="ja">字</span><div class="brandname">LISTENING STUDIO<small>JAPANESE PRACTICE</small></div></div><div class="navlabel">KHÔNG GIAN HỌC</div>${nav('library','Thư viện','PanelsTopLeft')}${nav('review','Ôn tập','Bookmark',S.difficult.length)}${nav('import','Tạo bài học','CirclePlus')}<div class="recent"><div class="navlabel">GẦN ĐÂY</div>${S.projects.slice(0,3).map(x=>`<button class="recent-item ${page==='workspace'&&pid===x.id?'active':''}" data-open="${x.id}"><span class="dot"></span><span>${esc(x.name)}</span></button>`).join('')}</div><div class="sidebottom">${nav('settings','Cài đặt','Settings2')}<div class="local">${icon('HardDrive')}Lưu trong trình duyệt</div><div class="version">DESIGN PREVIEW · 01</div></div></aside><main class="main"><header class="topbar"><div class="row">${ib('Menu','menu','Mở điều hướng')}<div class="crumb"><button data-nav="library">Không gian học</button>${icon('ChevronRight')}<span>${page==='workspace'?esc(p.name):({library:'Thư viện',review:'Ôn tập',import:'Tạo bài học',settings:'Cài đặt'})[page]}</span></div></div><div class="actions"><span class="preview">INTERACTIVE PREVIEW</span>${ib('CircleHelp','help','Hướng dẫn')}</div></header><div class="content">${body}</div></main></div>`}
function library(){let active=S.projects.find(p=>p.id===S.last)||S.projects[0];let ps=S.projects.filter(p=>(filter==='archived'?p.archived:!p.archived)&&(filter==='all'||filter==='archived'||p.type===filter)&&`${p.name} ${p.ja}`.toLowerCase().includes(search.toLowerCase()));ps.sort(sort==='name'?(a,b)=>a.name.localeCompare(b.name,'vi'):(a,b)=>(b.id===S.last)-(a.id===S.last));let tries=Object.values(S.results).filter(r=>!r.stale&&!r.revealed).length;return `<div class="pagehead"><div><div class="eyebrow">NGHE · HIỂU · TIẾN BỘ</div><h1>Mình học tiếp nhé.</h1><p>Một chút tập trung mỗi ngày sẽ tạo nên khác biệt.</p></div>${btn('Tạo bài học','new','primary','CirclePlus')}</div>${S.projects.length?`<section class="feature"><div class="featuremain"><span class="badge purple">${icon('Headphones')} ĐANG HỌC</span><h2>${esc(active.name)}</h2><div class="jp muted" lang="ja">${esc(active.ja)}</div><p>${active.level} · ${fmt(active.duration)} · ${active.chunks.length} đoạn · Tiếng Nhật → Tiếng Việt</p>${btn(done(active)?'Tiếp tục học':'Bắt đầu luyện nghe','resume','primary','Play')} <span class="small muted" style="margin-left:8px">Đoạn ${(active.last||0)+1} / ${active.chunks.length}</span></div><aside class="featureaside"><div class="row between small muted"><span>Tiến độ học</span><b>${pct(active)}%</b></div><div class="progress"><i style="width:${pct(active)}%"></i></div><span class="small muted">${done(active)} / ${active.chunks.length} đoạn đã hoàn thành</span><span class="badge green">${icon('Check')} Học liệu sẵn sàng</span></aside></section>`:''}<div class="statgrid"><div class="stat"><label>Bài học</label><strong>${S.projects.filter(p=>!p.archived).length.toString().padStart(2,'0')}</strong><small>Trong thư viện</small></div><div class="stat"><label>Đoạn đã luyện</label><strong>${S.projects.reduce((a,p)=>a+done(p),0).toString().padStart(2,'0')}</strong><small>Nghe chép, điền từ, dịch</small></div><div class="stat"><label>Lượt tự làm</label><strong>${tries.toString().padStart(2,'0')}</strong><small>Không tính lượt xem đáp án</small></div><div class="stat"><label>Cần ôn</label><strong>${S.difficult.length.toString().padStart(2,'0')}</strong><small>Đoạn bạn đã đánh dấu</small></div></div><div class="sectionhead"><h2>Bài học của bạn <span class="muted">· ${S.projects.length}</span></h2><div class="filters"><label class="search">${icon('Search')}<input aria-label="Tìm bài học" id="search" placeholder="Tìm bài học…" value="${esc(search)}"></label><select class="select compact" id="filter" aria-label="Lọc bài">${[['all','Đang học'],['audio','Audio'],['video','Video'],['archived','Đã lưu trữ']].map(([v,l])=>`<option value="${v}" ${filter===v?'selected':''}>${l}</option>`)}</select><select class="select compact" id="sort" aria-label="Sắp xếp"><option value="recent" ${sort==='recent'?'selected':''}>Gần đây</option><option value="name" ${sort==='name'?'selected':''}>Tên A–Z</option></select></div></div>${ps.length?`<div class="projectgrid">${ps.map(p=>`<article class="panel project"><div class="projecttop"><span class="badge">${icon(p.type==='video'?'Video':'Headphones')} ${p.level} · ${p.type==='video'?'Video':'Audio'}</span>${ib('Ellipsis','project-menu','Tùy chọn')}</div><div><button class="projecttitle" data-open="${p.id}">${esc(p.name)}</button><div class="jp muted" lang="ja">${esc(p.ja)}</div><div class="projectmeta"><span>${fmt(p.duration)} · ${p.chunks.length} đoạn</span><span>${done(p)}/${p.chunks.length} đã học</span></div><div class="progress"><i style="width:${pct(p)}%"></i></div></div><div class="projectfoot"><span class="badge ${p.archived?'amber':'green'}">${icon(p.archived?'Archive':'CircleCheck')} ${p.archived?'Đã lưu trữ':'Sẵn sàng'}</span><button class="btn sm ghost" data-open="${p.id}">Học tiếp ${icon('ArrowRight')}</button></div></article>`).join('')}</div>`:`<section class="panel empty">${icon('Search')}<h2>Chưa tìm thấy bài phù hợp.</h2><p>Thử tìm bằng tên khác hoặc điều chỉnh bộ lọc.</p>${btn('Xóa bộ lọc','clear-filter','soft')}</section>`}<p class="muted small" style="margin-top:17px">${icon('Info')} Bài mẫu, xử lý AI và phản hồi dịch được mô phỏng. Dữ liệu học lưu trong trình duyệt.</p>`}
function tabs(){return `<nav class="tabs" aria-label="Các màn của bài học">${[['listen','Luyện nghe','Headphones'],['translation','Nghe dịch','Languages'],['video','Song ngữ','Captions'],['editor','Biên tập','SlidersHorizontal'],['progress','Tiến độ','ChartNoAxesColumn']].map(([t,l,i])=>`<button class="tab ${tab===t?'active':''}" data-tab="${t}" aria-current="${tab===t?'page':'false'}">${icon(i)}${l}</button>`).join('')}</nav>`}
function head(){let p=P();return `<div class="projecthead"><div><div class="eyebrow">${p.level} · KHÔNG GIAN LUYỆN NGHE</div><h1>${esc(p.name)}</h1><p lang="ja">${esc(p.ja)} <span class="soft"> · </span>${fmt(p.duration)} <span class="soft">·</span> ${p.chunks.length} đoạn <span class="soft">·</span> Bản ${p.revision||1}</p></div><div class="row">${btn('Xuất bài','export','ghost','Download')}${ib('Ellipsis','project-options','Tùy chọn bài')}</div></div>${tabs()}`}
function rail(){return `<aside class="panel rail"><div class="railhead"><div class="row between"><h3>Đoạn hội thoại</h3><span class="mono muted">${P().chunks.length}</span></div><select class="select compact" id="listfilter"><option value="all">Tất cả các đoạn</option><option value="difficult" ${filter==='difficult'?'selected':''}>Đánh dấu khó</option></select></div><div class="segments">${P().chunks.map((c,i)=>`<button class="segment ${i===ix?'active':''}" data-chunk="${i}" aria-current="${i===ix}"><span class="segno">${String(i+1).padStart(2,'0')}</span><span><strong>Người nói ${esc(c.speaker)}</strong><small>${fmt(c.start)} — ${fmt(c.end)}</small></span>${marked(c)?icon('BookmarkCheck'):S.results[`${pid}:${c.id}:full`]?icon('CircleCheck'):icon('Circle')}</button>`).join('')}</div><div class="railfoot">${done(P())} / ${P().chunks.length} đoạn đã học</div></aside>`}
function playerCard(){const c=C(),len=c.end-c.start;return `<section class="panel player"><div class="playerhead"><div class="row"><span class="badge purple">Người nói ${esc(c.speaker)}</span><span class="mono">${fmt(c.start)} — ${fmt(c.end)}</span></div><span class="badge">${fileUrl[pid]?'Media bạn chọn':'Giọng đọc mẫu'}</span></div>${fileUrl[pid]?`<${P().type==='video'?'video':'audio'} id="media" class="${P().type==='video'?'videoactual':''}" src="${esc(fileUrl[pid])}" preload="metadata" ${P().type==='video'?'controls':''}></${P().type==='video'?'video':'audio'}>`:''}<div class="wave" title="Waveform minh họa"><canvas id="waveform"></canvas><span class="playhead" id="playhead"></span></div><input type="range" id="seek" class="range" min="0" max="100" value="0" aria-label="Vị trí phát trong đoạn"><div class="transport"><div class="transportgroup"><button class="control" data-action="prev" aria-label="Đoạn trước" ${ix===0?'disabled':''}>${icon('SkipBack')}</button><button class="playbtn" data-action="play" aria-label="Phát" id="playbtn">${icon('Play')}</button><button class="control" data-action="next" aria-label="Đoạn tiếp">${icon('SkipForward')}</button><span class="mono muted" id="ptime">00:00 / ${fmt(len)}</span></div><div class="transportgroup"><button class="control" data-action="replay" aria-label="Nghe lại">${icon('RotateCcw')}</button><select class="select compact" id="speed" aria-label="Tốc độ">${[.6,.75,1,1.25,1.5].map(x=>`<option value="${x}" ${S.settings.speed===x?'selected':''}>${x}×</option>`)}</select><button class="control ${S.settings.loop?'active':''}" data-action="loop" aria-pressed="${S.settings.loop}">${icon('Repeat2')}<span class="toolbarhelp">Lặp</span></button><button class="control ${marked(c)?'active':''}" data-action="mark" aria-pressed="${marked(c)}">${icon('Bookmark')}<span class="toolbarhelp">Đánh dấu</span></button></div></div></section>`}
function selector(){return `<div class="panel mobile-segments"><span class="small muted">Đoạn đang học</span><select class="select compact" id="chunkselect" aria-label="Chọn đoạn">${P().chunks.map((c,i)=>`<option value="${i}" ${i===ix?'selected':''}>Đoạn ${i+1} · ${fmt(c.start)}–${fmt(c.end)}</option>`).join('')}</select></div>`}
function question(){const c=C(),m=tab==='translation'?'translation':mode,k=`${pid}:${c.id}:${m}`,r=S.results[k],draft=S.drafts[k]||'';let clozeVal=draft;let clozeHtml='';if(mode==='cloze'&&tab==='listen'){let bits=c.jp.split(c.answer);clozeHtml=`<div class="cloze jp" lang="ja">${esc(bits[0])}<input id="answer" aria-label="Từ còn thiếu" value="${esc(clozeVal)}" placeholder="…" autocomplete="off">${esc(bits.slice(1).join(c.answer))}</div>`}return `<section class="panel question"><div class="questiontop"><span class="eyebrow" style="margin:0">ĐOẠN ${String(ix+1).padStart(2,'0')} <span class="soft">/ ${P().chunks.length}</span></span>${tab==='listen'?`<div class="segmented"><button data-mode="full" class="${mode==='full'?'active':''}" aria-pressed="${mode==='full'}">Điền cả câu</button><button data-mode="cloze" class="${mode==='cloze'?'active':''}" aria-pressed="${mode==='cloze'}">Điền từ thiếu</button></div>`:'<span class="badge">Tập trung vào ý nghĩa</span>'}</div><h2>${tab==='translation'?'Bạn hiểu đoạn này như thế nào?':mode==='cloze'?'Nghe và hoàn thành câu.':'Nghe kỹ rồi viết lại bằng tiếng Nhật.'}</h2><p class="questionintro">${tab==='translation'?'Diễn đạt tự nhiên bằng tiếng Việt. Bạn có thể nghe lại trước khi trả lời.':mode==='cloze'?'Điền cụm từ còn thiếu. Có thể dùng kanji hoặc hiragana.':'Đáp án sẽ chỉ xuất hiện sau khi bạn chọn chấm bài.'}</p>${mode==='cloze'&&tab==='listen'?clozeHtml:`<label class="label" for="answer">${tab==='translation'?'Bản dịch của bạn':'Câu bạn nghe được'}</label><textarea id="answer" class="textarea answertextarea ${tab==='listen'?'jp':''}" ${tab==='listen'?'lang="ja"':''} spellcheck="false" placeholder="${tab==='translation'?'Mình hiểu là…':'Nhập tiếng Nhật tại đây…'}">${esc(draft)}</textarea>`}<div class="answerfooter"><span id="draftlabel">${draft?'Nháp đã lưu':'Tự lưu khi bạn nhập'}</span><span>${tab==='translation'?'Tiếng Việt':'日本語'}</span></div>${hinted?`<p class="hint">${icon('Lightbulb')} ${tab==='translation'?'Ngữ cảnh: ':'Cách đọc tham khảo: '}${esc(tab==='translation'?c.vi:c.kana)}</p>`:''}<div class="questionactions"><div class="row">${btn(graded?'Đang chấm…':'Chấm bài','grade','primary','Check',graded?'disabled':'')}${btn('Gợi ý','hint','ghost','Lightbulb')}</div><button class="btn ghost" data-action="reveal">${icon('Eye')} Xem đáp án</button></div>${r?feedback(r,c,m):''}<details class="note"><summary>Ghi chú cho đoạn này</summary><textarea id="note" class="textarea" placeholder="Từ mới, điều muốn ghi nhớ…">${esc(S.notes[`${pid}:${c.id}`]||'')}</textarea></details></section>`}
function feedback(r,c,m){return `<section class="feedback"><div class="row between wrap"><div><h3>${r.revealed?'Đáp án tham khảo':m==='translation'?'Phản hồi mẫu':r.score>=95?'Nghe rất tốt!':r.score>=65?'Bạn đã nghe được phần lớn.':'Cùng nghe kỹ thêm nhé.'}</h3><small class="muted">${m==='translation'?'Preview không tự đánh giá độ đúng của bản dịch.':r.revealed?'Lượt xem đáp án không tính là tự làm.':'So khớp văn bản trong preview; không phải điểm JLPT.'}</small></div>${m==='translation'||r.revealed?'':`<strong class="score">${r.score}<span class="muted small">/100</span></strong>`}</div><div class="compare"><small class="muted">Đáp án tham khảo</small><div class="jp" lang="ja">${esc(c.jp)}</div><span class="muted">${esc(c.kana)}</span><span class="muted small">${esc(c.vi)}</span>${!r.revealed&&m!=='translation'?`<div class="divider"></div><small>Bài làm của bạn</small><span class="jp">${esc(r.input)}</span>`:''}</div>${m==='translation'?`<div class="notice">${icon('Info')}Bản dùng AI sẽ hiển thị ý đúng, ý còn thiếu và gợi ý diễn đạt. Hiện chưa có AI chấm nghĩa.</div>`:`<p class="small muted">Dấu câu và khoảng trắng được bỏ qua khi so khớp. Bài làm được so với transcript mẫu.</p>`}<div class="row between wrap"><div class="row">${btn('Nghe lại','replay','ghost sm','RotateCcw')}${btn('Làm lại','retry','ghost sm')}</div>${btn(ix===P().chunks.length-1?'Kết thúc buổi':'Đoạn tiếp theo','next','primary sm','ArrowRight')}</div><button class="btn ghost sm" data-action="report">${icon('Flag')} Transcript có lỗi?</button></section>`}
function listPractice(){return `<div class="stack">${P().chunks.map((c,i)=>{let k=`${pid}:${c.id}:full`;return `<section class="panel pad"><div class="row between"><div class="row"><span class="badge purple">Đoạn ${i+1}</span><span class="mono muted">${fmt(c.start)}–${fmt(c.end)}</span></div><button class="btn sm ghost" data-row-play="${i}">${icon('Play')}Nghe</button></div><textarea class="textarea jp" lang="ja" data-list="${c.id}" placeholder="Nhập câu bạn nghe được…">${esc(S.drafts[k]||'')}</textarea><button class="btn sm soft" data-row-grade="${i}">Mở và chấm ${icon('ArrowRight')}</button></section>`}).join('')}</div>`}
function listen(){return `<div class="studygrid">${rail()}<div class="studybody">${selector()}${playerCard()}${layout==='focus'?question():listPractice()}<div class="row between muted small"><span>${icon('CloudCheck')} Nháp tự lưu</span><button class="btn sm ghost" data-action="layout">${icon(layout==='focus'?'List':'PanelsTopLeft')}${layout==='focus'?'Xem dạng danh sách':'Tập trung một đoạn'}</button></div></div></div>`}
function switches(){return `<div class="toggle-row"><span>Tiếng Nhật</span><button class="switch" role="switch" aria-checked="${S.settings.subjp}" data-toggle="subjp"></button></div><div class="toggle-row"><span>Furigana</span><button class="switch" role="switch" aria-checked="${S.settings.furigana}" data-toggle="furigana"></button></div><div class="toggle-row"><span>Bản dịch tiếng Việt</span><button class="switch" role="switch" aria-checked="${S.settings.subvi}" data-toggle="subvi"></button></div>`}
function videoPage(){let c=C();return `<div class="video-layout"><div class="stack"><section class="panel"><div class="pad row between"><h3>${P().type==='video'?'Video song ngữ':'Nghe cùng phụ đề'}</h3><span class="badge purple">${ix+1} / ${P().chunks.length}</span></div><div class="video-screen">${fileUrl[pid]&&P().type==='video'?`<video controls class="videoactual" src="${esc(fileUrl[pid])}"></video>`:`<span class="badge purple">${icon(P().type==='video'?'Video':'AudioLines')} NGHE · ĐỌC · HIỂU</span>`}<div class="jp" lang="ja">${S.settings.furigana?`<ruby>${esc(c.jp)}<rt>${esc(c.kana)}</rt></ruby>`:esc(c.jp)}</div><p class="subtitle">${esc(c.vi)}</p></div><div class="pad small muted">Chọn câu để nghe từng đoạn. Giọng đọc mẫu không căn chỉnh từng từ.</div></section>${playerCard()}<section class="panel pad"><h3>Phụ đề hiển thị</h3>${switches()}</section></div><aside class="panel"><div class="pad row between"><h3>Transcript</h3><span class="mono muted">${P().chunks.length} câu</span></div>${P().chunks.map((x,i)=>`<button class="cue ${i===ix?'active':''}" data-chunk="${i}"><div class="row between"><small class="mono">${fmt(x.start)}</small><span class="badge">Người nói ${x.speaker}</span></div><div class="jp" lang="ja">${esc(x.jp)}</div><div class="vi">${esc(x.vi)}</div></button>`).join('')}</aside></div>`}
function editor(){let c=C();return `<div class="stack"><div class="notice">${icon('Info')}Biên tập học liệu. Khi sửa transcript, kết quả cũ sẽ yêu cầu luyện lại.</div><section class="panel timelinebox"><div class="row between"><div><h3>Timeline hội thoại</h3><p class="small muted">Chọn đoạn để chỉnh sửa, tách hoặc gộp.</p></div><div class="row">${btn('Hoàn tác','undo','ghost sm','Undo2',undo.length?'':'disabled')}${btn('Làm lại','redo','ghost sm','Redo2',redo.length?'':'disabled')}</div></div><div class="row between muted mono" style="margin-top:14px"><span>00:00</span><span>${fmt(P().duration/2)}</span><span>${fmt(P().duration)}</span></div><div class="timeline-scroll"><div class="timeline-track">${P().chunks.map((x,i)=>`<button class="region ${i===ix?'active':''}" style="flex:${x.end-x.start}" data-chunk="${i}" title="${fmt(x.start)}–${fmt(x.end)}">${String(i+1).padStart(2,'0')}<small>${x.speaker}</small></button>`).join('')}</div></div><div class="row wrap">${btn('Nghe đoạn','play','sm','Play')}${btn('Tách đoạn','split','ghost sm','Scissors',c.end-c.start<2?'disabled':'')}${btn('Gộp đoạn tiếp theo','merge','ghost sm','Combine',ix===P().chunks.length-1?'disabled':'')}<span class="muted small" style="margin-left:auto">${P().chunks.length} đoạn · Bản ${P().revision}</span></div></section><div class="editorgrid"><section class="panel editlist">${P().chunks.map((x,i)=>`<button class="editrow ${i===ix?'active':''}" data-chunk="${i}"><span class="mono muted">${String(i+1).padStart(2,'0')}</span><span><small>${fmt(x.start)}–${fmt(x.end)} · Người nói ${x.speaker}</small><span class="jp" lang="ja">${esc(x.jp)}</span><small>${esc(x.vi)}</small></span></button>`).join('')}</section><form class="panel editform" id="editform"><div class="row between"><h3>Đoạn ${String(ix+1).padStart(2,'0')}</h3><span id="editstatus" class="badge green">Đã lưu</span></div><div class="two"><label class="label">Bắt đầu (giây)<input class="input" name="start" type="number" step=".1" min="0" value="${c.start}" required></label><label class="label">Kết thúc (giây)<input class="input" name="end" type="number" step=".1" min="0" value="${c.end}" required></label></div><label class="label">Người nói<select class="select" name="speaker">${['A','B','C'].map(x=>`<option ${x===c.speaker?'selected':''}>${x}</option>`)}</select></label><label class="label">Transcript tiếng Nhật<textarea class="textarea jp" name="jp" lang="ja" required>${esc(c.jp)}</textarea></label><label class="label">Cách đọc hiragana<textarea class="textarea jp" name="kana" lang="ja">${esc(c.kana)}</textarea></label><label class="label">Bản dịch<textarea class="textarea" name="vi">${esc(c.vi)}</textarea></label><button class="btn primary" type="submit">${icon('Save')}Lưu đoạn</button></form></div></div>`}
function progressPage(){let p=P(),rs=p.chunks.flatMap(c=>['full','cloze','translation'].map(m=>({m,r:S.results[`${pid}:${c.id}:${m}`]}))).filter(x=>x.r&&!x.r.stale),sc=rs.filter(x=>x.m!=='translation'&&!x.r.revealed),avg=sc.length?Math.round(sc.reduce((a,x)=>a+x.r.score,0)/sc.length):null;return `<div class="pagehead"><div><h2>Những bước bạn đã đi.</h2><p>Tiến độ theo bài học này.</p></div>${btn('Ôn đoạn khó','review-project','primary','Bookmark')}</div><div class="statgrid"><div class="stat"><label>Đã luyện</label><strong>${done(p)} / ${p.chunks.length}</strong><small>${pct(p)}% bài học</small></div><div class="stat"><label>So khớp transcript</label><strong>${avg===null?'—':avg+'%'}</strong><small>Nghe chép & điền từ</small></div><div class="stat"><label>Đánh dấu khó</label><strong>${p.chunks.filter(c=>marked(c)).length}</strong><small>Các đoạn bạn chọn</small></div><div class="stat"><label>Bài dịch đã nộp</label><strong>${rs.filter(x=>x.m==='translation').length}</strong><small>Chưa có AI chấm nghĩa</small></div></div><div class="chartgrid"><section class="panel pad"><h3>Lượt luyện theo chế độ</h3><p class="muted small" style="margin-top:5px">Số đoạn có bài làm hoặc đã xem đáp án.</p><div class="stack" style="margin-top:18px">${[['full','Nghe chép'],['cloze','Điền từ'],['translation','Nghe dịch']].map(([m,l])=>{let n=rs.filter(x=>x.m===m).length;return `<div class="row"><span class="small muted" style="width:78px">${l}</span><div class="progress" style="flex:1"><i style="width:${Math.round(n/p.chunks.length*100)}%"></i></div><span class="mono muted">${n}/${p.chunks.length}</span></div>`}).join('')}</div></section><section class="panel pad"><h3>Gợi ý bước tiếp</h3><p class="muted" style="margin:10px 0 15px;font-size:11px">${S.difficult.length?`Bạn đã đánh dấu ${S.difficult.length} đoạn. Hãy nghe lại chậm hơn rồi thử trả lời.`:'Thử chế độ điền từ, sau đó nghe chép cả câu.'}</p>${btn('Mở ôn tập','review-project','soft','ArrowRight')}</section></div><section class="panel pad" style="margin-top:14px"><div class="row between"><div><h3>Kiểm tra học liệu</h3><p class="small muted" style="margin-top:5px">${p.chunks.length} đoạn · Trung bình ${(p.chunks.reduce((a,c)=>a+c.end-c.start,0)/p.chunks.length).toFixed(1)} giây/đoạn · ${new Set(p.chunks.map(c=>c.speaker)).size} người nói</p></div>${btn('Biên tập','edit-open','ghost','SlidersHorizontal')}</div></section>`}
function review(){let rows=[];S.projects.filter(p=>!p.archived).forEach(p=>p.chunks.forEach((c,i)=>{let mark=S.difficult.includes(`${p.id}:${c.id}`),bad=['full','cloze'].some(m=>{let r=S.results[`${p.id}:${c.id}:${m}`];return r&&!r.stale&&!r.revealed&&r.score<80});if(reviewFilter==='marked'?mark:reviewFilter==='wrong'?bad:mark||bad)rows.push({p,c,i,mark,bad})}));return `<div class="pagehead"><div><div class="eyebrow">NGHE LẠI · GHI NHỚ LÂU HƠN</div><h1>Dành thêm thời gian cho đoạn khó.</h1><p>Các đoạn bạn đã đánh dấu hoặc muốn nghe lại.</p></div>${rows.length?`<button class="btn primary" data-review="${rows[0].p.id}" data-index="${rows[0].i}">${icon('Play')}Bắt đầu ôn</button>`:''}</div><div class="segmented" style="margin-bottom:15px">${[['all','Tất cả'],['marked','Đã đánh dấu'],['wrong','Chưa đạt 80%']].map(([v,l])=>`<button data-review-filter="${v}" class="${reviewFilter===v?'active':''}">${l}</button>`).join('')}</div>${rows.length?`<section class="panel">${rows.map(({p,c,i,mark,bad},n)=>`<div class="reviewrow"><span class="mono" style="color:var(--purple)">${String(n+1).padStart(2,'0')}</span><div><span class="small muted">${esc(p.name)} · Đoạn ${i+1} · ${fmt(c.start)}–${fmt(c.end)}</span><div class="jp" lang="ja">${esc(c.jp)}</div><small>${bad?'Cần nghe lại':'Đã đánh dấu'} · Người nói ${c.speaker}</small></div><div class="row"><button class="btn sm ghost" data-review="${p.id}" data-index="${i}">${icon('Headphones')}Luyện lại</button>${mark?`<button class="icbtn" data-unmark="${p.id}:${c.id}" aria-label="Bỏ đánh dấu">${icon('BookmarkCheck')}</button>`:''}</div></div>`).join('')}</section>`:`<section class="panel empty">${icon('CircleCheck')}<h2>Chưa có đoạn nào cần ôn.</h2><p>Đánh dấu đoạn trong lúc nghe để tìm lại ở đây.</p>${btn('Về thư viện','library','primary','ArrowLeft')}</section>`}<div class="notice" style="margin-top:14px">${icon('Info')}Trong danh sách ôn, transcript được hiện để bạn chọn đoạn. Khi bắt đầu luyện lại, bài làm và điểm cũ sẽ được ẩn.</div>`}
function importPage(){if(job)return jobScreen();return `<div class="pagehead"><div><div class="eyebrow">BẮT ĐẦU TỪ MỘT ĐOẠN NGHE</div><h1>Tạo bài học mới.</h1><p>Thêm audio/video, dùng đường dẫn hoặc thử với bài mẫu.</p></div>${btn('Thư viện','library','ghost','ArrowLeft')}</div><div class="steps"><span class="active"><i>1</i>Chọn nguồn</span>${icon('ChevronRight')}<span class="${importFile||source==='sample'||youtube?'active':''}"><i>2</i>Thiết lập</span>${icon('ChevronRight')}<span><i>3</i>Chuẩn bị</span></div><div class="importgrid"><div class="stack"><section class="panel pad"><div class="segmented"><button data-source="upload" class="${source==='upload'?'active':''}">Audio / Video</button><button data-source="youtube" class="${source==='youtube'?'active':''}">YouTube URL</button><button data-source="sample" class="${source==='sample'?'active':''}">Bài mẫu</button></div>${source==='upload'?`<div class="drop" id="drop">${icon('Upload')}<h3>Kéo file audio hoặc video vào đây</h3><p>MP3 · WAV · M4A · MP4 · WebM · MOV · MKV</p><label class="btn primary" for="mediafile">${icon('FolderOpen')}Chọn file từ máy</label><input class="hidden" id="mediafile" type="file" accept="audio/*,video/*,.mkv,.m4a,.mov"></div>`:source==='youtube'?`<label class="label" style="margin-top:18px">Đường dẫn video<input id="yt" class="input" placeholder="https://www.youtube.com/watch?v=…" value="${esc(youtube)}"><small>Preview kiểm tra định dạng; không tải media từ YouTube.</small></label>`:`<div class="filebox">${icon('Headphones')}<span><strong>Hẹn nhau trước kỳ thi</strong><br><small class="muted">N4 · 66 giây · 9 đoạn hội thoại</small></span></div>`}${importFile&&source==='upload'?`<div class="filebox">${icon('FileAudio')}<span style="flex:1"><strong>${esc(importFile.name)}</strong><br><small class="muted">${(importFile.size/1024/1024).toFixed(1)} MB · File chỉ có trong phiên này</small></span>${ib('X','remove-file','Bỏ file')}</div>`:''}<label class="label" style="margin-top:18px">Tên bài học<input class="input" id="importname" value="${esc(importName)}" placeholder="Ví dụ: Hội thoại tại nhà ga"></label></section><section class="panel pad"><div class="row between"><div><h3>Chọn độ dài đoạn</h3><p class="small muted">Có thể điều chỉnh thêm trong phần biên tập.</p></div><span class="badge purple">${preset==='balanced'?'Khuyến nghị':'Đã chọn'}</span></div><div class="presetgrid">${[['short','Nhiều đoạn','Cụm ngắn, tập trung'],['balanced','Cân bằng','Một ý cho mỗi đoạn'],['long','Ít đoạn','Câu dài, nhiều ngữ cảnh']].map(([v,l,d])=>`<button class="preset ${preset===v?'active':''}" data-preset="${v}" aria-pressed="${preset===v}">${l}<small>${d}</small></button>`).join('')}</div><details><summary class="small muted" style="cursor:pointer">Thiết lập nâng cao</summary><div class="two" style="margin-top:12px"><label class="label">Số người nói<select class="select" id="speakers"><option value="auto">Tự nhận diện</option><option value="1">1 người</option><option value="2">2 người</option></select></label><label class="label">Ngôn ngữ nguồn<input class="input" value="Tiếng Nhật" readonly></label></div></details><div class="divider"></div>${btn('Tạo bài học thử','start','primary','Sparkles')}</section></div><aside class="stack"><section class="panel pad"><div class="eyebrow">SAU KHI CHUẨN BỊ</div><h3>Học theo cách bạn muốn.</h3>${[['Headphones','Nghe chép và điền từ'],['Languages','Nghe rồi diễn đạt ý'],['Captions','Đọc transcript song ngữ'],['SlidersHorizontal','Chỉnh đáp án từng đoạn']].map(([i,l])=>`<div class="row muted" style="margin-top:15px;font-size:10px">${icon(i)}${l}</div>`).join('')}</section><div class="notice">${icon('Info')}Preview mô phỏng quy trình bằng hội thoại mẫu. Media chọn từ máy dùng để thử phát, không được gửi đi xử lý.</div></aside></div>`}
function jobScreen(){let stage=Math.min(3,Math.floor(job.progress/25));return `<div class="pagehead"><div><div class="eyebrow">CHUẨN BỊ BÀI HỌC</div><h1>${job.status==='done'?'Bài học đã sẵn sàng.':job.status==='error'?'Một bước cần thử lại.':job.status==='cancel'?'Đã dừng xử lý.':'Đang chuẩn bị…'}</h1><p>${esc(job.name)} · Luồng mô phỏng</p></div>${btn('Về thư viện','library','ghost','ArrowLeft')}</div><div class="importgrid"><section class="panel pad"><div class="row between"><h2>${job.status==='done'?'Hoàn tất':job.status==='running'?'Đang xử lý':job.status==='error'?'Kiểm tra lỗi':'Đã hủy'}</h2><strong style="font-size:22px;color:var(--purple)">${job.progress}%</strong></div><div class="progress" style="margin:13px 0"> <i style="width:${job.progress}%"></i></div>${['Chuẩn hóa nguồn','Nhận dạng giọng nói','Tạo phụ đề & bản dịch','Chuẩn bị bài luyện'].map((x,i)=>`<div class="jobstep ${job.progress>=(i+1)*25?'done':i===stage&&job.status==='running'?'active':''}">${icon(job.progress>=(i+1)*25?'CircleCheck':i===stage&&job.status==='running'?'LoaderCircle':'Circle')}<div><strong>${x}</strong><small>${job.progress>=(i+1)*25?'Đã xong':i===stage?(job.status==='error'?'Mô phỏng trạng thái lỗi':'Đang thực hiện'):'Đang chờ'}</small></div></div>`).join('')}<div class="row wrap" style="margin-top:18px">${job.status==='done'?btn('Vào luyện tập','job-open','primary','ArrowRight'):job.status==='running'?btn('Hủy xử lý','cancel','danger','X'):btn('Thử lại','retry-job','primary','RefreshCw')}${job.status==='running'?btn('Xem trạng thái lỗi','sim-error','ghost sm'):btn('Tạo bài khác','clear-job','ghost')}</div></section><aside class="panel pad"><h3>Tiến trình vẫn được giữ</h3><p class="muted small" style="margin:10px 0">Bạn có thể trở lại thư viện trong lúc luồng mô phỏng chạy.</p><div class="notice">${icon('ShieldCheck')}Không gọi dịch vụ AI và không upload file.</div></aside></div>`}
function settingsPage(){return `<div class="pagehead"><div><div class="eyebrow">KHÔNG GIAN CỦA BẠN</div><h1>Cài đặt.</h1><p>Chọn cách nghe, cách đọc và quản lý dữ liệu.</p></div></div><div class="settingslayout"><nav class="settingsnav">${[['learning','Học tập','Headphones'],['runtime','Model & xử lý','Cpu'],['data','Dữ liệu','Database']].map(([v,l,n])=>`<button class="${settingTab===v?'active':''}" data-stab="${v}">${icon(n)}${l}</button>`).join('')}</nav><div>${settingTab==='learning'?`<section class="panel settingsection"><h2>Nghe và luyện tập</h2><label class="label">Tốc độ mặc định<select id="defaultspeed" class="select">${[.6,.75,1,1.25,1.5].map(x=>`<option value="${x}" ${S.settings.speed===x?'selected':''}>${x}×</option>`)}</select></label><label class="label">Nghỉ giữa hai lần lặp<select id="gap" class="select">${[0,1,2,3].map(x=>`<option ${S.settings.gap===x?'selected':''} value="${x}">${x} giây</option>`)}</select></label>${tog('loop','Lặp lại đoạn nghe',S.settings.loop)}${tog('auto','Tự sang đoạn tiếp',S.settings.auto)}</section><section class="panel settingsection"><h2>Phụ đề</h2>${tog('furigana','Hiện furigana khi xem đáp án',S.settings.furigana)}${tog('subjp','Hiện tiếng Nhật ở màn song ngữ',S.settings.subjp)}${tog('subvi','Hiện bản dịch tiếng Việt',S.settings.subvi)}<small class="muted">Đáp án luôn được ẩn khi bắt đầu lượt luyện.</small></section><div class="notice">${icon('Check')}Cài đặt học tập tự lưu trong trình duyệt.</div>`:settingTab==='runtime'?runtimeSettings():`<section class="panel settingsection"><h2>Dữ liệu của bạn</h2><p class="muted small" style="margin-bottom:15px">Nháp, tiến độ, ghi chú và bản sửa được lưu tại trình duyệt này. File media chỉ tồn tại trong phiên đang mở.</p><div class="row wrap">${btn('Xuất bản sao','backup','primary','Download')}<label class="btn" for="restore">${icon('Upload')}Nhập bản sao</label><input class="hidden" id="restore" type="file" accept="application/json"></div></section><section class="panel settingsection"><h2>Khôi phục dữ liệu mẫu</h2><p class="muted small" style="margin-bottom:12px">Tạo lại bài mẫu ban đầu và xóa tiến độ preview.</p>${btn('Khôi phục','reset-confirm','danger','RotateCcw')}</section>`}</div></div>`}
