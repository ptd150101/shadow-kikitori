[project]
name = "jlpt-listening-studio-api"
version = "0.1.0"
description = "Local-first JLPT listening practice API and processing worker"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "alembic>=1.14",
  "fastapi>=0.115",
  "httpx>=0.28",
  "platformdirs>=4.3",
  "pydantic-settings>=2.7",
  "python-multipart>=0.0.20",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.34",
]

[dependency-groups]
ai = [
  "accelerate>=1.3",
  "pyannote.audio>=3.3",
  "silero-vad>=5.1",
  "soundfile>=0.13",
  "sudachidict-core>=20250129",
  "sudachipy>=0.6.10",
  "torch>=2.5",
  "torchaudio>=2.5",
  "transformers>=4.48",
]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6.0",
  "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jlpt_studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]
